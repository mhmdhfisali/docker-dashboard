<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Docker Control Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              darkbg: "#090d16",
              cardbg: "#111827",
              bordercolor: "#1e293b",
            },
          },
        },
      }
    </script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #090d16;
      }
      ::-webkit-scrollbar-thumb {
        background: #1e293b;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #334155;
      }
    </style>
  </head>
  <body
    class="bg-darkbg text-slate-100 min-h-screen font-sans antialiased p-4 md:p-8"
  >
    <div class="max-w-6xl mx-auto space-y-6">
      <!-- Top Header -->
      <div
        class="flex flex-col md:flex-row md:items-center justify-between border-b border-slate-800 pb-5 gap-4"
      >
        <div class="flex items-center space-x-4">
          <div
            class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-sky-500/20 to-blue-600/20 border border-sky-500/30 flex items-center justify-center shadow-lg shadow-sky-500/10"
          >
            <i class="fa-brands fa-docker text-3xl text-sky-400"></i>
          </div>
          <div>
            <h1
              class="text-2xl font-black text-white tracking-wide flex items-center gap-2"
            >
              Docker Control Center
              <span
                class="text-[10px] font-mono font-bold bg-sky-500/10 text-sky-400 border border-sky-500/20 px-2 py-0.5 rounded-full"
                >v2.0 Pro</span
              >
            </h1>
            <p class="text-xs text-slate-400 font-medium">
              Interactive Container Dashboard & Real-time Resource Manager
            </p>
          </div>
        </div>

        <div class="flex items-center space-x-3">
          <button
            onclick="stopAll()"
            class="px-4 py-2.5 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 text-xs font-bold rounded-xl border border-rose-500/30 transition active:scale-95 flex items-center gap-2 shadow-sm"
          >
            <i class="fa-solid fa-power-off"></i>
            <span>Stop All</span>
          </button>
          <button
            onclick="fetchStatus()"
            class="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-xs font-bold rounded-xl border border-slate-700 transition active:scale-95 flex items-center gap-2 shadow-sm"
          >
            <i class="fa-solid fa-rotate-right text-sky-400"></i>
            <span>Refresh</span>
          </button>
        </div>
      </div>

      <!-- System Stats Widgets Grid (Mengisi Ruang Kosong) -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div
          class="bg-cardbg border border-bordercolor p-4 rounded-2xl flex items-center space-x-4 shadow-lg"
        >
          <div
            class="w-10 h-10 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400"
          >
            <i class="fa-solid fa-circle-play text-lg"></i>
          </div>
          <div>
            <p
              class="text-[11px] text-slate-400 font-bold uppercase tracking-wider"
            >
              Running
            </p>
            <h3
              id="stat-running"
              class="text-xl font-black text-white font-mono"
            >
              0
            </h3>
          </div>
        </div>

        <div
          class="bg-cardbg border border-bordercolor p-4 rounded-2xl flex items-center space-x-4 shadow-lg"
        >
          <div
            class="w-10 h-10 rounded-xl bg-sky-500/10 border border-sky-500/20 flex items-center justify-center text-sky-400"
          >
            <i class="fa-solid fa-cubes text-lg"></i>
          </div>
          <div>
            <p
              class="text-[11px] text-slate-400 font-bold uppercase tracking-wider"
            >
              Total Stacks
            </p>
            <h3
              id="stat-stacks"
              class="text-xl font-black text-white font-mono"
            >
              0
            </h3>
          </div>
        </div>

        <div
          class="bg-cardbg border border-bordercolor p-4 rounded-2xl flex items-center space-x-4 shadow-lg"
        >
          <div
            class="w-10 h-10 rounded-xl bg-purple-500/10 border border-purple-500/20 flex items-center justify-center text-purple-400"
          >
            <i class="fa-solid fa-microchip text-lg"></i>
          </div>
          <div>
            <p
              class="text-[11px] text-slate-400 font-bold uppercase tracking-wider"
            >
              CPU Load
            </p>
            <h3 id="stat-cpu" class="text-xl font-black text-white font-mono">
              0.0%
            </h3>
          </div>
        </div>

        <div
          class="bg-cardbg border border-bordercolor p-4 rounded-2xl flex items-center space-x-4 shadow-lg"
        >
          <div
            class="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-amber-400"
          >
            <i class="fa-solid fa-memory text-lg"></i>
          </div>
          <div>
            <p
              class="text-[11px] text-slate-400 font-bold uppercase tracking-wider"
            >
              RAM Usage
            </p>
            <h3
              id="stat-mem"
              class="text-xs font-bold text-slate-200 font-mono truncate max-w-[110px]"
            >
              Active
            </h3>
          </div>
        </div>
      </div>

      <!-- Filter Search Bar -->
      <div class="flex items-center justify-between gap-4">
        <div class="relative flex-1">
          <i
            class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-xs text-slate-500"
          ></i>
          <input
            type="text"
            id="search-input"
            oninput="filterStacks()"
            placeholder="Cari stack atau container (misal: smii, sppg, mysql)..."
            class="w-full bg-cardbg border border-bordercolor rounded-xl pl-10 pr-4 py-2.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-sky-500/50 transition shadow-inner"
          />
        </div>
        <button
          onclick="toggleExpandAll()"
          class="px-3 py-2.5 bg-slate-900 border border-slate-800 text-slate-400 hover:text-white rounded-xl text-xs font-semibold transition flex items-center gap-1.5"
        >
          <i class="fa-solid fa-up-down text-xs"></i>
          <span id="expand-label">Collapse All</span>
        </button>
      </div>

      <!-- Stacks List Container -->
      <div class="space-y-4" id="stack-container">
        <!-- Generated Dynamically -->
      </div>
    </div>

    <!-- Terminal Logs Modal -->
    <div
      id="logs-modal"
      class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4"
    >
      <div
        class="bg-cardbg border border-slate-700 w-full max-w-3xl rounded-2xl overflow-hidden shadow-2xl flex flex-col max-h-[80vh]"
      >
        <div
          class="bg-slate-900 px-5 py-3.5 border-b border-slate-800 flex items-center justify-between"
        >
          <div class="flex items-center space-x-2">
            <span class="w-3 h-3 rounded-full bg-rose-500 inline-block"></span>
            <span class="w-3 h-3 rounded-full bg-amber-500 inline-block"></span>
            <span
              class="w-3 h-3 rounded-full bg-emerald-500 inline-block"
            ></span>
            <span
              id="modal-title"
              class="font-mono text-xs font-bold text-slate-300 ml-3"
              >Container Logs</span
            >
          </div>
          <button
            onclick="closeLogsModal()"
            class="text-slate-400 hover:text-white text-sm"
          >
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <pre
          id="modal-logs-body"
          class="p-5 font-mono text-xs text-emerald-400 bg-[#06090f] overflow-y-auto flex-1 leading-relaxed whitespace-pre-wrap"
        >
Memuat logs...</pre
        >
      </div>
    </div>

    <script>
      const openCards = {}
      let globalStacksData = {}
      let allExpanded = true

      async function fetchStatus() {
        try {
          const res = await fetch("/api/status")
          const data = await res.json()

          document.getElementById("stat-running").innerText = data.totalRunning
          document.getElementById("stat-stacks").innerText = Object.keys(
            data.stacks,
          ).length
          document.getElementById("stat-cpu").innerText = data.cpuUsage
          document.getElementById("stat-mem").innerText = data.memUsage

          globalStacksData = data.stacks
          filterStacks()
        } catch (err) {
          console.error(err)
        }
      }

      function toggleCollapse(prefix) {
        openCards[prefix] = !(openCards[prefix] ?? true)
        renderStacks(globalStacksData)
      }

      function toggleExpandAll() {
        allExpanded = !allExpanded
        Object.keys(globalStacksData).forEach((k) => {
          openCards[k] = allExpanded
        })
        document.getElementById("expand-label").innerText = allExpanded
          ? "Collapse All"
          : "Expand All"
        renderStacks(globalStacksData)
      }

      function filterStacks() {
        const q = document.getElementById("search-input").value.toLowerCase()
        if (!q) {
          renderStacks(globalStacksData)
          return
        }

        const filtered = {}
        Object.keys(globalStacksData).forEach((prefix) => {
          const stack = globalStacksData[prefix]
          const matchStack =
            stack.name.toLowerCase().includes(q) ||
            prefix.toLowerCase().includes(q)
          const matchContainer = stack.containers.some((c) =>
            c.name.toLowerCase().includes(q),
          )
          if (matchStack || matchContainer) {
            filtered[prefix] = stack
          }
        })
        renderStacks(filtered)
      }

      function getTechIcon(name) {
        const lower = name.toLowerCase()
        if (lower.includes("pma") || lower.includes("phpmyadmin"))
          return '<i class="fa-solid fa-database text-amber-400"></i>'
        if (lower.includes("mysql") || lower.includes("db"))
          return '<i class="fa-solid fa-server text-sky-400"></i>'
        if (lower.includes("laravel") || lower.includes("app"))
          return '<i class="fa-solid fa-globe text-emerald-400"></i>'
        if (lower.includes("redis"))
          return '<i class="fa-solid fa-bolt text-rose-400"></i>'
        return '<i class="fa-solid fa-cube text-slate-400"></i>'
      }

      function renderStacks(stacks) {
        const container = document.getElementById("stack-container")
        const keys = Object.keys(stacks)

        if (keys.length === 0) {
          container.innerHTML = `<div class="p-8 text-center bg-cardbg rounded-2xl border border-slate-800 text-slate-500 text-xs">Tidak ada stack atau container yang cocok.</div>`
          return
        }

        container.innerHTML = keys
          .map((prefix) => {
            const stack = stacks[prefix]
            const isActive = stack.isRunning
            const isOpen = openCards[prefix] ?? true

            const subContainersHTML = stack.containers
              .map((c) => {
                const icon = getTechIcon(c.name)
                const portsHTML =
                  c.ports.length > 0
                    ? c.ports
                        .map(
                          (p) => `
                <a href="http://localhost:${p}" target="_blank" onclick="event.stopPropagation()" class="px-2.5 py-1 bg-sky-500/10 hover:bg-sky-500/20 text-sky-400 rounded-lg text-xs font-mono border border-sky-500/30 flex items-center space-x-1.5 transition">
                  <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                  <span>:${p}</span>
                </a>
              `,
                        )
                        .join("")
                    : `<span class="text-[11px] text-slate-500 font-mono">No Port</span>`

                return `
            <div class="flex items-center justify-between bg-slate-900/60 border border-slate-800/80 px-4 py-3 rounded-xl hover:border-slate-700 transition">
              <div class="flex items-center space-x-3 truncate">
                <span class="w-2 h-2 rounded-full ${c.isRunning ? "bg-emerald-400 animate-pulse" : "bg-slate-600"}"></span>
                ${icon}
                <span class="font-mono text-xs ${c.isRunning ? "text-slate-200 font-semibold" : "text-slate-400"} truncate">${c.name}</span>
              </div>
              <div class="flex items-center space-x-2">
                ${portsHTML}
                <button onclick="openLogs('${c.name}')" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 text-[11px] font-mono rounded-lg border border-slate-700 transition" title="Lihat Logs">
                  <i class="fa-solid fa-terminal text-[10px]"></i>
                </button>
              </div>
            </div>
          `
              })
              .join("")

            return `
          <div class="bg-cardbg border ${isActive ? "border-emerald-500/30 shadow-emerald-950/10" : "border-bordercolor"} rounded-2xl overflow-hidden transition-all shadow-xl">
            <!-- Card Header -->
            <div onclick="toggleCollapse('${prefix}')" class="p-5 flex items-center justify-between cursor-pointer hover:bg-slate-800/30 transition">
              <div class="flex items-center space-x-4">
                <div class="w-8 h-8 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center">
                  <i class="fa-solid fa-chevron-down text-slate-400 text-xs transition-transform duration-200 ${isOpen ? "rotate-180" : ""}"></i>
                </div>
                <div>
                  <div class="flex items-center space-x-3">
                    <h3 class="font-black text-lg text-white tracking-wide">${stack.name}</h3>
                    <span class="px-2.5 py-0.5 rounded-full text-[10px] font-mono font-bold uppercase tracking-wider ${isActive ? "bg-emerald-500/10 text-emerald-400 border border-emerald-500/30" : "bg-rose-500/10 text-rose-400 border border-rose-500/30"}">
                      ${isActive ? "RUNNING" : "STOPPED"}
                    </span>
                  </div>
                  <p class="text-xs text-slate-400 font-mono mt-0.5">${stack.containers.length} sub-containers attached</p>
                </div>
              </div>

              <div class="flex items-center space-x-3" onclick="event.stopPropagation()">
                <button onclick="toggleStack('${prefix}', '${isActive ? "stop" : "start"}')"
                  class="px-5 py-2.5 rounded-xl text-xs font-extrabold transition-all shadow-md active:scale-95 flex items-center gap-2 ${
                    isActive
                      ? "bg-rose-600 hover:bg-rose-700 text-white shadow-rose-950/40"
                      : "bg-emerald-600 hover:bg-emerald-700 text-white shadow-emerald-950/40"
                  }">
                  <i class="fa-solid ${isActive ? "fa-power-off" : "fa-play"}"></i>
                  <span>${isActive ? "STOP STACK" : "START STACK"}</span>
                </button>
              </div>
            </div>

            <!-- Collapsible Body -->
            <div class="${isOpen ? "block" : "hidden"} border-t border-slate-800/80 p-4 bg-slate-950/40 space-y-2.5">
              ${subContainersHTML}
            </div>
          </div>
        `
          })
          .join("")
      }

      async function toggleStack(prefix, action) {
        await fetch("/api/toggle", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prefix, action }),
        })
        fetchStatus()
      }

      async function stopAll() {
        if (confirm("Matikan seluruh container Docker yang sedang berjalan?")) {
          await fetch("/api/toggle", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "stop_all" }),
          })
          fetchStatus()
        }
      }

      async function openLogs(containerName) {
        document.getElementById("modal-title").innerText =
          `Logs: ${containerName}`
        document.getElementById("modal-logs-body").innerText =
          "Memuat logs terminal..."
        document.getElementById("logs-modal").classList.remove("hidden")

        try {
          const res = await fetch(`/api/logs/${containerName}`)
          const data = await res.json()
          document.getElementById("modal-logs-body").innerText = data.logs
        } catch (err) {
          document.getElementById("modal-logs-body").innerText =
            "Gagal mengambil logs."
        }
      }

      function closeLogsModal() {
        document.getElementById("logs-modal").classList.add("hidden")
      }

      fetchStatus()
      setInterval(fetchStatus, 3000)
    </script>
  </body>
</html>
